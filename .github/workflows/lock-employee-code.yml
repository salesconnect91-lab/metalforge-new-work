name: Lock employee code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-employee-code.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch employee code UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/master-data/Employees.tsx')
          s = p.read_text(encoding='utf-8')
          old = '        employee_code: form.employee_code.trim() || null,\n'
          new = '        employee_code: editing ? (editing.employee_code ?? null) : null,\n'
          if old not in s: raise SystemExit('employee payload marker not found')
          s = s.replace(old, new, 1)
          old = '                <input\n                  className="input mt-1 w-full"\n                  value={form.employee_code}\n                  onChange={(e) =>\n                    setForm((x) => ({ ...x, employee_code: e.target.value }))\n                  }\n                  placeholder="EMP-001"\n                />\n'
          new = '                <input\n                  className="input mt-1 w-full cursor-not-allowed bg-slate-50 text-slate-500"\n                  value={editing?.employee_code ?? ""}\n                  readOnly\n                  disabled\n                  placeholder={editing ? "" : "Auto-generated on save"}\n                  title="Employee code is generated automatically and cannot be edited"\n                />\n'
          if old not in s: raise SystemExit('employee code input marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/master-data/Employees.tsx
          git commit -m 'Make employee codes automatic and read-only'
          git push origin main
