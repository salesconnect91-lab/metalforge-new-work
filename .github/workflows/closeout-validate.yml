name: Closeout validate

on:
  push:
    branches: [final-standardization-closeout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-standardization-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Synchronize package lock"
            git pull --rebase origin final-standardization-closeout
            git push origin HEAD:final-standardization-closeout
          fi
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --run
