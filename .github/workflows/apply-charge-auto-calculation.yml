name: Apply generic charge auto-calculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-charge-auto-calculation.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch charge calculation logic
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_charge.py
          python3 /tmp/patch_charge.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit verified update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-charge-auto-calculation.yml
          git add src/lib/chargeCalculation.ts src/modules/sales/SalesInvoiceCreate.tsx src/modules/purchase/MainPurchaseInvoiceV2.tsx
          git commit -m "Auto-calculate configured charges by invoice UOM"
          git push origin main
