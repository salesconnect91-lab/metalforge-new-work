name: Purchase detail finalize

on:
  push:
    branches: [final-standardization-closeout]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-standardization-closeout
      - name: Finalize purchase detail dynamic charges and print
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/modules/purchase/PurchaseInvoiceDetail.tsx')
          s=p.read_text()
          s=s.replace('import { exportToCSV, exportToExcel } from "@/lib/exportUtils";\nimport { chargesFromRecord, getChargeBreakdown } from "@/lib/chargeTypes";','import { exportToCSV, exportToExcel, triggerPrint } from "@/lib/exportUtils";')
          if 'type PurchaseChargeRow' not in s:
            marker='type PaymentAccount = { account_id: string; mapping_key: "cash" | "bank"; label: string };\n'
            add='type PurchaseChargeRow = { charge_key:string; charge_name:string; amount:number|string; tax_percent?:number|string|null; quantity?:number|string|null; rate?:number|string|null };\n'
            s=s.replace(marker,marker+add)
          s=s.replace('  const [consolidated, setConsolidated] = useState<Consolidated[]>([]);','  const [consolidated, setConsolidated] = useState<Consolidated[]>([]);\n  const [purchaseCharges, setPurchaseCharges] = useState<PurchaseChargeRow[]>([]);')
          old='''    const [orderRes, linesRes, itemsRes, godownRes] = await Promise.all([\n      supabase.from("purchase_orders").select("*, supplier:suppliers(id,name,name_urdu,phone,address,ntn,strn,cnic,tax_registration_status)").eq("id", id).maybeSingle(),\n      supabase.from("purchase_order_lines").select("*, item:items(id,name,name_urdu,sku,hs_code,unit), godown:godowns(id,name,name_urdu)").eq("order_id", id).order("created_at"),\n      supabase.from("items").select("id,name,name_urdu,sku,cost,hs_code,unit").order("name"),\n      supabase.from("godowns").select("id,name,name_urdu").order("name"),\n    ]);\n    const firstError = orderRes.error || linesRes.error || itemsRes.error || godownRes.error;'''
          new='''    const [orderRes, linesRes, itemsRes, godownRes, chargesRes] = await Promise.all([\n      supabase.from("purchase_orders").select("*, supplier:suppliers(id,name,name_urdu,phone,address,ntn,strn,cnic,tax_registration_status)").eq("id", id).maybeSingle(),\n      supabase.from("purchase_order_lines").select("*, item:items(id,name,name_urdu,sku,hs_code,unit), godown:godowns(id,name,name_urdu)").eq("order_id", id).order("created_at"),\n      supabase.from("items").select("id,name,name_urdu,sku,cost,hs_code,unit").order("name"),\n      supabase.from("godowns").select("id,name,name_urdu").order("name"),\n      supabase.from("purchase_order_charges").select("charge_key,charge_name,amount,tax_percent,quantity,rate").eq("order_id", id).order("created_at"),\n    ]);\n    const firstError = orderRes.error || linesRes.error || itemsRes.error || godownRes.error || chargesRes.error;'''
          if old not in s: raise SystemExit('load block not found')
          s=s.replace(old,new,1)
          s=s.replace('    setLines((linesRes.data ?? []) as Line[]);','    setLines((linesRes.data ?? []) as Line[]);\n    setPurchaseCharges((chargesRes.data ?? []) as PurchaseChargeRow[]);',1)
          old2='''  const charges = order ? getChargeBreakdown(chargesFromRecord(order as unknown as Record<string, unknown>), "purchase") : [];\n  const chargeTotal = charges.reduce((sum, charge) => sum + n(charge.amount), 0);'''
          new2='''  const charges = purchaseCharges;\n  const chargeTotal = charges.reduce((sum, charge) => sum + n(charge.amount), 0);'''
          if old2 not in s: raise SystemExit('charge block not found')
          s=s.replace(old2,new2,1)
          s=s.replace('  const chargeVat = isTax ? chargeTotal * n(order?.tax_percent) / 100 : 0;','  const chargeVat = isTax ? charges.reduce((sum, charge) => sum + n(charge.amount) * n(charge.tax_percent ?? order?.tax_percent) / 100, 0) : 0;',1)
          s=s.replace('  const printInvoice = async () => { await loadPrintSettings(); requestAnimationFrame(() => requestAnimationFrame(() => window.print())); };','  const printInvoice = async () => { await loadPrintSettings(); triggerPrint(".print-document"); };',1)
          s=s.replace('exportToExcel(`${order.order_no}-purchase.xls`','exportToExcel(`${order.order_no}-purchase.xlsx`')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/purchase/PurchaseInvoiceDetail.tsx
          git commit -m "Finalize purchase detail dynamic charges and shared print"
          git push origin HEAD:final-standardization-closeout
