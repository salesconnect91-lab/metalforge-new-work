name: Fix purchase charge types

on:
  push:
    branches: [final-standardization-closeout]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-standardization-closeout
      - name: Fix purchase charge typing
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/modules/purchase/PurchaseInvoiceDetail.tsx')
          s=p.read_text()
          old='type PurchaseChargeRow = { charge_key:string; charge_name:string; amount:number|string; tax_percent?:number|string|null; quantity?:number|string|null; rate?:number|string|null };'
          new='type PurchaseChargeRow = { charge_key:string; charge_name:string; amount:number|string; tax_percent?:number|string|null; quantity?:number|string|null; rate?:number|string|null };'
          if old not in s:
              raise SystemExit('PurchaseChargeRow type not found')
          s=s.replace('''{charges.map((charge) => <div key={charge.label} className="flex justify-between text-slate-600"><span>{charge.label}</span><span>{formatCurrency(charge.amount)}</span></div>)}''','''{charges.map((charge) => <div key={charge.charge_key} className="flex justify-between text-slate-600"><span>{charge.charge_name}</span><span>{formatCurrency(n(charge.amount))}</span></div>)}''')
          s=s.replace('chargeBreakdown={charges}','chargeBreakdown={charges.map((charge) => ({ label: charge.charge_name, amount: n(charge.amount) }))}')
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/purchase/PurchaseInvoiceDetail.tsx
          git commit -m "Fix dynamic purchase charge typing"
          git push origin HEAD:final-standardization-closeout
