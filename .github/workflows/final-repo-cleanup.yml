name: Final repository cleanup

on:
  push:
    branches: [final-standardization-closeout]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-standardization-closeout
      - name: Remove archived and one-off patch artifacts
        shell: bash
        run: |
          rm -rf backup coa-backup metalforge-new-main-work-20260828
          rm -rf supabase/.temp src/.vscode
          rm -f git tsconfig.tsbuildinfo tsconfig.node.tsbuildinfo vite.config.js vite.config.d.ts public/.package-lock.json
          rm -f scripts/applyInvoiceDescriptionPatch.mjs scripts/fix-journal-search-template.mjs scripts/migrate-searchable-selects.mjs
          rm -f .github/*.trigger
          find .github/workflows -maxdepth 1 -type f ! -name 'build.yml' ! -name 'final-repo-cleanup.yml' -delete
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove archived and one-off patch artifacts"
          git push origin HEAD:final-standardization-closeout
