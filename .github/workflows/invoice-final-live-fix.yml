name: Final invoice Urdu description fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/invoice-final-live-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Patch and verify source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n!=s: p.write_text(n,encoding='utf-8'); print('patched',path)
              else: print('unchanged',path)

          def sales(s):
              s=s.replace('godown_id: line.godown_id || "",\n            }))', 'godown_id: line.godown_id || "",\n              description: line.description || "",\n            }))')
              s=s.replace('godown_id: row.godown_id || null,\n        }));', 'godown_id: row.godown_id || null,\n        description: row.description.trim() || null,\n        }));')
              s=s.replace('{ item_id: "", qty: "0", rate: "0", tax_percent: globalTaxPercent, godown_id: godowns[0]?.id || "" },', '{ item_id: "", qty: "0", rate: "0", tax_percent: globalTaxPercent, godown_id: godowns[0]?.id || "", description: "" },')
              s=s.replace('{customers.map((customer) => (\n                    <option key={customer.id} value={customer.id}>\n                      {customer.name}\n                    </option>', '{customers.map((customer) => (\n                    <option key={customer.id} value={customer.id}>\n                      {customer.name}{customer.name_urdu ? ` / ${customer.name_urdu}` : ""}\n                    </option>')
              s=s.replace('{item.name} ({item.sku})', '{item.name}{item.name_urdu ? ` / ${item.name_urdu}` : ""} ({item.sku})')
              s=s.replace('{g.name}\n                            </option>', '{g.name}{g.name_urdu ? ` / ${g.name_urdu}` : ""}\n                            </option>')
              needle='</select>\n                      </td>\n\n                      <td className="py-3 pr-3">\n                        <select\n                          className="input min-w-[160px]"\n                          value={row.godown_id}'
              repl='</select>\n                      </td>\n\n                      <td className="py-3 pr-3">\n                        <input className="input min-w-[180px]" placeholder="Optional description / تفصیل" value={row.description} disabled={isLocked} onChange={(e) => updateRow(index, "description", e.target.value)} />\n                      </td>\n\n                      <td className="py-3 pr-3">\n                        <select\n                          className="input min-w-[160px]"\n                          value={row.godown_id}'
              if 'placeholder="Optional description / تفصیل"' not in s: s=s.replace(needle,repl)
              s=s.replace('<th className="text-left py-3 pr-3">Godown / گودام</th>', '<th className="text-left py-3 pr-3">Description / تفصیل</th>\n                  <th className="text-left py-3 pr-3">Godown / گودام</th>')
              s=s.replace('<td className="py-2">{item?.name || "—"}</td>', '<td className="py-2"><div>{item?.name || "—"}{item?.name_urdu ? ` / ${item.name_urdu}` : ""}</div>{row.description && <div className="text-xs text-slate-500">{row.description}</div>}</td>')
              s=s.replace('<div className="font-semibold">{selectedCustomer?.name || "—"}</div>', '<div className="font-semibold">{selectedCustomer?.name || "—"}{selectedCustomer?.name_urdu ? ` / ${selectedCustomer.name_urdu}` : ""}</div>')
              return s
          edit('src/modules/sales/SalesInvoiceCreate.tsx', sales)

          def consolidated(s):
              s=s.replace('tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n          }))', 'tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n          }))')
              s=s.replace('tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n          }))', 'tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n          }))')
              s=s.replace('tax_percent: String(row.tax_percent ?? 0),\n          }))', 'tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n          }))')
              s=s.replace('tax_percent: Number(row.tax_percent) || 0,\n        }))', 'tax_percent: Number(row.tax_percent) || 0,\n          description: row.description.trim() || null,\n        }))')
              s=s.replace('        tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n      }))', '        tax_percent: String(row.tax_percent ?? 0),\n      }))')
              s=s.replace('            tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n          }))', '            tax_percent: String(row.tax_percent ?? 0),\n          }))')
              s=s.replace('        tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n      }))', '        tax_percent: String(row.tax_percent ?? 0),\n      }))')
              s=s.replace('        tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",\n    }))', '        tax_percent: String(row.tax_percent ?? 0),\n    }))')
              s=s.replace('        tax_percent: String(row.tax_percent ?? 0),\n            description: row.description ?? "",', '        tax_percent: String(row.tax_percent ?? 0),')
              return s
          edit('src/modules/sales/ConsolidatedInvoices.tsx', consolidated)

          def pdetail(s):
              s=s.replace('type Option = { id: string; name: string; sku?: string | null; cost?: number | string | null };','type Option = { id: string; name: string; name_urdu?: string | null; sku?: string | null; cost?: number | string | null };')
              s=s.replace('type Godown = { id: string; name: string };','type Godown = { id: string; name: string; name_urdu?: string | null };')
              s=s.replace('const [newLine, setNewLine] = useState({ item_id: "", godown_id: "", qty: "1", unit_cost: "0" });','const [newLine, setNewLine] = useState({ item_id: "", description: "", godown_id: "", qty: "1", unit_cost: "0" });')
              s=s.replace('order_id: id, item_id: newLine.item_id, godown_id: newLine.godown_id, qty, unit_cost: cost,','order_id: id, item_id: newLine.item_id, description: newLine.description.trim() || null, godown_id: newLine.godown_id, qty, unit_cost: cost,')
              s=s.replace('setNewLine({ item_id: "", godown_id: godowns[0]?.id || "", qty: "1", unit_cost: "0" });','setNewLine({ item_id: "", description: "", godown_id: godowns[0]?.id || "", qty: "1", unit_cost: "0" });')
              return s
          edit('src/modules/purchase/PurchaseInvoiceDetail.tsx', pdetail)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/sales/SalesInvoiceCreate.tsx src/modules/sales/ConsolidatedInvoices.tsx src/modules/purchase/PurchaseInvoiceDetail.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Complete invoice Urdu godown description flow'
          git push origin main
