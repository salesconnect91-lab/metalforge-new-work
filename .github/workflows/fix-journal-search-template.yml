name: Fix Journal Search Template

on:
  push:
    branches: [main]
    paths:
      - '.github/fix-journal-search-template.trigger'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply journal fixes
        run: node scripts/fix-journal-search-template.mjs
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund
      - name: Verify TypeScript build
        run: npm run build
      - name: Commit journal fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/accounting/JournalEntryDetail.tsx src/modules/accounting/JournalEntryList.tsx
          if git diff --cached --quiet; then
            echo "No journal changes needed."
            exit 0
          fi
          git commit -m "Fix journal searchable fields and Excel template"
          git push origin main
