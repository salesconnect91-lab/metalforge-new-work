<!-- wordmark -->
<text x="450" y="700" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="700" letter-spacing="14">NAVILO</text>
<path d="M322 677l24-42 24 42z" fill="#10b9f5"/>
<text x="450" y="765" text-anchor="middle" fill="#d8e5f2" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" letter-spacing="7">Run Your Business as One.</text>
</svg>