name: Finish steel report

on:
  push:
    paths:
      - '.github/finish-steel-report.trigger'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finish steel stock report blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/reports/SteelStockControl.tsx')
          s=p.read_text(encoding='utf-8-sig')

          if 'useAuth' not in s:
            s=s.replace('import { ErrorBanner, formatCurrency } from "@/components/ui";','import { ErrorBanner, formatCurrency } from "@/components/ui";\nimport { useAuth } from "@/auth/AuthContext";')

          if 'const { activeCompany } = useAuth();' not in s:
            s=s.replace('export default function SteelStockControl() {','export default function SteelStockControl() {\n  const { activeCompany } = useAuth();')

          if 'const categorySummary = useMemo' not in s:
            anchor='  const exportCsv = () => {\n'
            block='''  const categorySummary = useMemo(() => {
    const map = new Map<string, any>();
    for (const r of filteredStock) {
      const key = r.category_name || "Uncategorized";
      const row = map.get(key) ?? { category: key, purchase: 0, sale: 0, book: 0, current: 0, variance: 0, value: 0 };
      row.purchase += n(r.purchase_in_qty);
      row.sale += n(r.sales_out_qty);
      row.book += n(r.book_quantity);
      row.current += n(r.current_quantity);
      row.variance += n(r.variance_quantity);
      row.value += n(r.stock_value);
      map.set(key, row);
    }
    return Array.from(map.values()).sort((a, b) => a.category.localeCompare(b.category));
  }, [filteredStock]);

  const visibleGodowns = useMemo(() => godown === "all" ? godowns : godowns.filter((g) => g === godown), [godown, godowns]);

  const godownMatrix = useMemo(() => {
    const map = new Map<string, any>();
    for (const r of filteredStock) {
      const key = `${r.category_name || "Uncategorized"}__${r.item_id}`;
      const row = map.get(key) ?? { category: r.category_name || "Uncategorized", item: r.item_name, grade: r.grade, size: r.size, total: 0, godowns: {} as Record<string, number> };
      const g = r.godown || "Unassigned";
      row.godowns[g] = (row.godowns[g] || 0) + n(r.current_quantity);
      row.total += n(r.current_quantity);
      map.set(key, row);
    }
    return Array.from(map.values()).sort((a, b) => `${a.category} ${a.item}`.localeCompare(`${b.category} ${b.item}`));
  }, [filteredStock]);

  const negativeStock = useMemo(() => filteredStock.filter((r) => n(r.current_quantity) < -0.0001), [filteredStock]);

  const commercialCategorySummary = useMemo(() => {
    const map = new Map<string, any>();
    for (const r of filteredCommercial) {
      const key = r.category_name || "Uncategorized";
      const row = map.get(key) ?? { category: key, purchaseQty: 0, purchaseValue: 0, saleQty: 0, saleValue: 0 };
      row.purchaseQty += n(r.net_purchase_qty);
      row.purchaseValue += n(r.net_purchase_value);
      row.saleQty += n(r.net_sales_qty);
      row.saleValue += n(r.net_sales_value);
      map.set(key, row);
    }
    return Array.from(map.values()).map((r) => {
      const purchaseAvg = r.purchaseQty ? r.purchaseValue / r.purchaseQty : 0;
      const saleAvg = r.saleQty ? r.saleValue / r.saleQty : 0;
      return { ...r, purchaseAvg, saleAvg, spread: saleAvg - purchaseAvg };
    }).sort((a, b) => a.category.localeCompare(b.category));
  }, [filteredCommercial]);

'''
            if anchor not in s: raise SystemExit('export anchor missing')
            s=s.replace(anchor, block+anchor, 1)

          if 'Report generated:' not in s:
            anchor='''            <p className="mt-1 text-xs text-slate-500">
              Book stock, physical stock, movement reconciliation and commercial rate intelligence.
            </p>'''
            repl=anchor+'''\n            <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs font-semibold text-slate-600">
              <span>{activeCompany?.company_name || "MetalForge"}</span>
              <span>Report generated: {new Date().toLocaleString()}</span>
              <span>{category === "all" ? "All Categories" : category}</span>
              {mode === "stock" && <span>{godown === "all" ? "All Godowns" : godown}</span>}
            </div>'''
            if anchor not in s: raise SystemExit('header anchor missing')
            s=s.replace(anchor,repl,1)

          if 'Category Consolidation / کیٹیگری خلاصہ' not in s:
            anchor='''      {loading ? (
        <div className="rounded-xl border bg-white p-10 text-center text-sm text-slate-500">Loading steel stock logic…</div>
      ) : mode === "stock" ? ('''
            block='''      {!loading && mode === "stock" && (
        <>
          <div className="overflow-hidden rounded-xl border border-slate-200 bg-white">
            <div className="border-b border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-900">Category Consolidation / کیٹیگری خلاصہ</div>
            <div className="overflow-x-auto"><table className="w-full text-xs"><thead className="bg-slate-50"><tr>
              <th className="p-2 text-left">Steel Group / Category</th><th className="p-2 text-right">Purchase</th><th className="p-2 text-right">Sale</th><th className="p-2 text-right">Book</th><th className="p-2 text-right">Current</th><th className="p-2 text-right">Variance</th><th className="p-2 text-right">Value</th>
            </tr></thead><tbody>{categorySummary.map((r) => <tr key={r.category} className="border-t border-slate-100"><td className="p-2 font-bold">{r.category}</td><td className="p-2 text-right">{qty(r.purchase)}</td><td className="p-2 text-right">{qty(r.sale)}</td><td className="p-2 text-right">{qty(r.book)}</td><td className="p-2 text-right font-bold">{qty(r.current)}</td><td className={`p-2 text-right font-bold ${Math.abs(r.variance) >= 0.0001 ? "text-rose-700" : "text-emerald-700"}`}>{qty(r.variance)}</td><td className="p-2 text-right">{money(r.value)}</td></tr>)}</tbody></table></div>
          </div>

          <div className="overflow-hidden rounded-xl border border-slate-200 bg-white">
            <div className="border-b border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-900">Godown-wise Stock Matrix / گودام وار اسٹاک</div>
            <div className="overflow-x-auto"><table className="w-full text-xs"><thead className="bg-slate-50"><tr><th className="p-2 text-left">Category</th><th className="p-2 text-left">Item</th><th className="p-2 text-left">Grade / Size</th>{visibleGodowns.map((g) => <th key={g} className="p-2 text-right">{g}</th>)}<th className="p-2 text-right">Total</th></tr></thead><tbody>{godownMatrix.map((r, i) => <tr key={`${r.item}-${i}`} className="border-t border-slate-100"><td className="p-2">{r.category}</td><td className="p-2 font-semibold">{r.item}</td><td className="p-2">{[r.grade, r.size].filter(Boolean).join(" / ") || "—"}</td>{visibleGodowns.map((g) => <td key={g} className="p-2 text-right">{qty(r.godowns[g] || 0)}</td>)}<td className="p-2 text-right font-bold">{qty(r.total)}</td></tr>)}</tbody></table></div>
          </div>

          {negativeStock.length > 0 && <div className="overflow-hidden rounded-xl border border-rose-200 bg-white"><div className="border-b border-rose-200 bg-rose-50 px-3 py-2 text-sm font-bold text-rose-800">Negative Stock Exceptions / منفی اسٹاک</div><div className="overflow-x-auto"><table className="w-full text-xs"><thead className="bg-rose-50"><tr><th className="p-2 text-left">Item</th><th className="p-2 text-left">Godown</th><th className="p-2 text-right">Current Qty</th><th className="p-2 text-right">Book Qty</th></tr></thead><tbody>{negativeStock.map((r, i) => <tr key={`${r.item_id}-${r.godown_id}-${i}`} className="border-t border-rose-100"><td className="p-2 font-semibold">{r.item_name}</td><td className="p-2">{r.godown || "—"}</td><td className="p-2 text-right font-bold text-rose-700">{qty(r.current_quantity)}</td><td className="p-2 text-right">{qty(r.book_quantity)}</td></tr>)}</tbody></table></div></div>}
        </>
      )}

      {!loading && mode === "commercial" && commercialCategorySummary.length > 0 && (
        <div className="overflow-hidden rounded-xl border border-slate-200 bg-white">
          <div className="border-b border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-900">Category Purchase / Sale Average & Margin / اوسط ریٹ اور مارجن</div>
          <div className="overflow-x-auto"><table className="w-full text-xs"><thead className="bg-slate-50"><tr><th className="p-2 text-left">Category</th><th className="p-2 text-right">Purchase Qty</th><th className="p-2 text-right">Purchase Avg</th><th className="p-2 text-right">Sale Qty</th><th className="p-2 text-right">Sale Avg</th><th className="p-2 text-right">Margin / Spread</th></tr></thead><tbody>{commercialCategorySummary.map((r) => <tr key={r.category} className="border-t border-slate-100"><td className="p-2 font-bold">{r.category}</td><td className="p-2 text-right">{qty(r.purchaseQty)}</td><td className="p-2 text-right">{money(r.purchaseAvg)}</td><td className="p-2 text-right">{qty(r.saleQty)}</td><td className="p-2 text-right">{money(r.saleAvg)}</td><td className={`p-2 text-right font-bold ${r.spread < 0 ? "text-rose-700" : "text-emerald-700"}`}>{money(r.spread)}</td></tr>)}</tbody></table></div>
        </div>
      )}

'''
            if anchor not in s: raise SystemExit('loading anchor missing')
            s=s.replace(anchor, block+anchor,1)

          p.write_text(s,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit report finishing pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/reports/SteelStockControl.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Complete steel stock summary reporting"
            git push origin main
          fi
