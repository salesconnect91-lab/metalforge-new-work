name: Company Scope Cleanup
on:
  push:
    paths:
      - '.github/workflows/company-scope-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply company scope cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts','.tsx'}: continue
              original=path.read_text(encoding='utf-8-sig')
              text=original.replace('onConflict: "user_id,mapping_key"','onConflict: "company_id,mapping_key"').replace("onConflict: 'user_id,mapping_key'","onConflict: 'company_id,mapping_key'")
              text=re.sub(r'\s*\.eq\((['"'"'])user_id\1\s*,\s*[^\n\)]*\)', '', text)
              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))

          p=Path('src/modules/sales/SalesInvoiceDetail.tsx')
          s=p.read_text(encoding='utf-8')
          duplicate='''  const linkedHawalaTotal = linkedHawalaInvoices.reduce(\n    (sum, invoice) => sum + toNumber(invoice.total),\n    0\n  );\n'''
          if s.count('const linkedHawalaTotal')>1:
              if duplicate not in s: raise SystemExit('Duplicate linkedHawalaTotal block shape changed')
              s=s.replace(duplicate,'',1)
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))

          offenders=[]
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts','.tsx'}: continue
              text=path.read_text(encoding='utf-8-sig')
              if re.search(r'\.eq\((['"'"'])user_id\1',text) or 'onConflict: "user_id,' in text or "onConflict: 'user_id," in text:
                  offenders.append(str(path))
          if offenders: raise SystemExit('Legacy user-scoped frontend references remain: '+', '.join(offenders))
          print('Changed:', *sorted(set(changed)), sep='\n- ')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Complete frontend company scope cleanup'
          git push
