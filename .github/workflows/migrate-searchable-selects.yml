name: Migrate Searchable Selects

on:
  push:
    branches: [main]
    paths:
      - ".github/searchable-selects.trigger"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Convert native selects to SearchableSelect
        run: node scripts/migrate-searchable-selects.mjs
      - name: Verify no native select remains in TSX source
        run: |
          if grep -R --include='*.tsx' -n '<select\([ >]\)' src --exclude='SearchableSelect.tsx'; then
            echo 'Native select tags remain after migration.'
            exit 1
          fi
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No dropdown migrations were needed."
            exit 0
          fi
          git commit -m "Make ERP dropdowns natively searchable"
          git push origin main
