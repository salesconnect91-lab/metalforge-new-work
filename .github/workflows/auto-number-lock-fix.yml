name: Auto number lock fix
on:
  push:
    paths:
      - '.github/auto-number-lock.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch auto-generated number fields
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]}')
              p.write_text(s.replace(old, new, 1))

          # Cutting: use database RPC instead of rows.length + 1 and lock the field.
          replace(
              'src/modules/cutting/CuttingOrderList.tsx',
              '''  const openCreate = () => {\n    setForm({ order_no: `CUT-${String(rows.length + 1).padStart(4, "0")}`, customer_id: "", item_id: "", cut_length: "", qty: "0", loading_qty: "0" });\n    setModalOpen(true);\n  };''',
              '''  const openCreate = async () => {\n    setError(null);\n    const { data, error: numberError } = await supabase.rpc("next_cutting_order_no");\n    if (numberError) { setError(numberError.message); return; }\n    setForm({ order_no: String(data ?? ""), customer_id: "", item_id: "", cut_length: "", qty: "0", loading_qty: "0" });\n    setModalOpen(true);\n  };'''
          )
          replace(
              'src/modules/cutting/CuttingOrderList.tsx',
              '''action={<button onClick={openCreate} className="btn-primary">+ New Cutting Order</button>}''',
              '''action={<button onClick={() => void openCreate()} className="btn-primary">+ New Cutting Order</button>}'''
          )
          replace(
              'src/modules/cutting/CuttingOrderList.tsx',
              '''<div><label className="label">Order Number / آرڈر نمبر</label><input className="input" required value={form.order_no} onChange={(e) => setForm({ ...form, order_no: e.target.value })} /></div>''',
              '''<div><label className="label">Order Number / آرڈر نمبر</label><input className="input bg-slate-50 cursor-not-allowed" required readOnly tabIndex={-1} value={form.order_no} title="Order number is generated automatically" /></div>'''
          )

          # Journal: single-entry number is system generated, so don't allow manual edits.
          replace(
              'src/modules/accounting/JournalEntryList.tsx',
              '''                <input\n                  className="mt-1 w-full border rounded p-2 font-mono"\n                  required\n                  value={\n                    form.entry_no\n                  }\n                  onChange={(event) =>\n                    setForm({\n                      ...form,\n                      entry_no:\n                        event.target.value,\n                    })\n                  }\n                />''',
              '''                <input\n                  className="mt-1 w-full border rounded p-2 font-mono bg-slate-50 cursor-not-allowed"\n                  required\n                  readOnly\n                  tabIndex={-1}\n                  title="Entry number is generated automatically"\n                  value={form.entry_no}\n                />'''
          )

          # Consolidated purchase: invoice number is generated by the system and must never be editable.
          replace(
              'src/modules/purchase/ConsolidatedPurchaseInvoices.tsx',
              '''<div><label className="label">Invoice No.</label><input className="input" value={invoiceNo} disabled={locked} onChange={(e) => setInvoiceNo(e.target.value)} /></div>''',
              '''<div><label className="label">Invoice No.</label><input className="input bg-slate-50 cursor-not-allowed" value={invoiceNo} readOnly tabIndex={-1} title="Invoice number is generated automatically" /></div>'''
          )
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/cutting/CuttingOrderList.tsx src/modules/accounting/JournalEntryList.tsx src/modules/purchase/ConsolidatedPurchaseInvoices.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Lock and correct auto-generated document numbers"
          git push
