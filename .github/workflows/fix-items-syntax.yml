name: Fix Items syntax
on:
  push:
    paths:
      - '.github/fix-items-syntax.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing component brace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/master-data/Items.tsx')
          s=p.read_text()
          if not s.rstrip().endswith('}'):
              p.write_text(s.rstrip()+'}\n')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/master-data/Items.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Items component syntax"
          git push
