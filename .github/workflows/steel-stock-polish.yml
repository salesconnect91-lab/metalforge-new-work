name: Steel stock report polish

on:
  push:
    paths:
      - '.github/steel-stock-polish.trigger'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Polish steel stock navigation and reporting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path('src/components/Layout.tsx')
          s = layout.read_text(encoding='utf-8-sig')
          if 'Steel Stock Control / اسٹیل اسٹاک کنٹرول' not in s:
              anchor = '      { to: "/reports", label: "Reports Overview / رپورٹس", end: true, module: "reports" },\n'
              insert = anchor + '      { to: "/reports/steel-stock", label: "Steel Stock Control / اسٹیل اسٹاک کنٹرول", module: "reports" },\n'
              if anchor not in s:
                  raise SystemExit('Reports navigation anchor not found')
              s = s.replace(anchor, insert, 1)
          if '"/reports/steel-stock": "Steel Stock Control / اسٹیل اسٹاک کنٹرول"' not in s:
              anchor = '  "/reports": "Reports / رپورٹس",\n'
              insert = anchor + '  "/reports/steel-stock": "Steel Stock Control / اسٹیل اسٹاک کنٹرول",\n'
              if anchor not in s:
                  raise SystemExit('Reports page label anchor not found')
              s = s.replace(anchor, insert, 1)
          layout.write_text(s, encoding='utf-8')

          report = Path('src/modules/reports/SteelStockControl.tsx')
          s = report.read_text(encoding='utf-8-sig')

          if 'const categorySummary = useMemo' not in s:
              anchor = '  const exportCsv = () => {\n'
              block = '''  const categorySummary = useMemo(() => {
    const map = new Map<string, { category: string; current: number; book: number; variance: number; value: number; purchase: number; sale: number }>();
    for (const r of filteredStock) {
      const key = r.category_name || "Uncategorized";
      const row = map.get(key) ?? { category: key, current: 0, book: 0, variance: 0, value: 0, purchase: 0, sale: 0 };
      row.current += n(r.current_quantity);
      row.book += n(r.book_quantity);
      row.variance += n(r.variance_quantity);
      row.value += n(r.stock_value);
      row.purchase += n(r.purchase_in_qty);
      row.sale += n(r.sales_out_qty);
      map.set(key, row);
    }
    return Array.from(map.values()).sort((a, b) => a.category.localeCompare(b.category));
  }, [filteredStock]);

'''
              if anchor not in s:
                  raise SystemExit('Report export anchor not found')
              s = s.replace(anchor, block + anchor, 1)

          if 'Category Consolidation / کیٹیگری خلاصہ' not in s:
              anchor = '''      <div className="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-3 print:hidden lg:flex-row lg:items-end">'''
              block = '''      {mode === "stock" && categorySummary.length > 0 && (
        <div className="overflow-hidden rounded-xl border border-slate-200 bg-white">
          <div className="border-b border-slate-200 bg-slate-50 px-3 py-2 font-bold text-slate-800">Category Consolidation / کیٹیگری خلاصہ</div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="bg-slate-50"><tr>
                <th className="p-2 text-left">Category</th><th className="p-2 text-right">Purchase</th><th className="p-2 text-right">Sale</th><th className="p-2 text-right">Book</th><th className="p-2 text-right">Current</th><th className="p-2 text-right">Variance</th><th className="p-2 text-right">Value</th>
              </tr></thead>
              <tbody>{categorySummary.map((r) => <tr key={r.category} className="border-t border-slate-100">
                <td className="p-2 font-semibold">{r.category}</td><td className="p-2 text-right">{qty(r.purchase)}</td><td className="p-2 text-right">{qty(r.sale)}</td><td className="p-2 text-right">{qty(r.book)}</td><td className="p-2 text-right font-bold">{qty(r.current)}</td><td className={`p-2 text-right font-bold ${Math.abs(r.variance) >= 0.0001 ? "text-rose-700" : "text-emerald-700"}`}>{qty(r.variance)}</td><td className="p-2 text-right">{money(r.value)}</td>
              </tr>)}</tbody>
            </table>
          </div>
        </div>
      )}

'''
              if anchor not in s:
                  raise SystemExit('Report filter anchor not found')
              s = s.replace(anchor, block + anchor, 1)

          if 'steel-stock-print-rules' not in s:
              anchor = '    <div className="print-report space-y-4 pb-12" data-print-root>\n'
              rules = '''    <div className="print-report space-y-4 pb-12" data-print-root>
      <style>{`@media print { .steel-stock-print-rules table { font-size: 10.5px !important; } .steel-stock-print-rules th, .steel-stock-print-rules td { padding: 4px 5px !important; } .steel-stock-print-rules .summary-card { break-inside: avoid; } }`}</style>
      <div className="steel-stock-print-rules contents">\n'''
              if anchor not in s:
                  raise SystemExit('Print root anchor not found')
              s = s.replace(anchor, rules, 1)
              end = '    </div>\n  );\n}\n'
              if end not in s:
                  raise SystemExit('Report end anchor not found')
              s = s.replace(end, '      </div>\n    </div>\n  );\n}\n', 1)

          report.write_text(s, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit steel stock report polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Layout.tsx src/modules/reports/SteelStockControl.tsx
          if git diff --cached --quiet; then
            echo "No steel stock polish changes needed"
          else
            git commit -m "Polish steel stock control reporting"
            git push origin main
          fi
