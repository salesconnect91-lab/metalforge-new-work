name: Invoice Urdu and description patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/invoice-urdu-description.yml']
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Finish preview and print fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/sales/SalesInvoiceCreate.tsx'); s=p.read_text(encoding='utf-8'); o=s
          s=s.replace('{godown.name}\n                              </option>','{godown.name}{godown.name_urdu ? ` / ${godown.name_urdu}` : ""}\n                              </option>')
          s=s.replace('<div className="mt-1 text-sm font-bold">{selectedCustomerObj?.name || "—"}</div>','<div className="mt-1 text-sm font-bold">{selectedCustomerObj?.name || "—"}{selectedCustomerObj?.name_urdu ? ` / ${selectedCustomerObj.name_urdu}` : ""}</div>')
          s=s.replace('''<td className="border border-slate-300 px-2 py-2 font-semibold">{item?.name || "—"}<div className="text-[12px] font-normal text-slate-400">SKU: {item?.sku || "—"}</div></td>''','''<td className="border border-slate-300 px-2 py-2 font-semibold"><div>{item?.name || "—"}{item?.name_urdu ? ` / ${item.name_urdu}` : ""}</div>{r.description && <div className="mt-0.5 text-[12px] font-normal text-slate-600">{r.description}</div>}<div className="text-[12px] font-normal text-slate-400">SKU: {item?.sku || "—"}</div></td>''')
          s=s.replace('''{godowns.find((g) => g.id === r.godown_id)?.name || "—"}''','''{(() => { const g = godowns.find((x) => x.id === r.godown_id); return g ? `${g.name}${g.name_urdu ? ` / ${g.name_urdu}` : ""}` : "—"; })()}''')
          p.write_text(s,encoding='utf-8'); print('changed',s!=o)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/sales/SalesInvoiceCreate.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Show Urdu and descriptions in invoice preview print'
          git push origin main
