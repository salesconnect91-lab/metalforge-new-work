name: ERP-wide text contrast update

on:
  push:
    paths:
      - '.github/workflows/darken-erp-text.yml'

permissions:
  contents: write

jobs:
  darken:
    if: github.event.head_commit.message == 'Run ERP-wide text contrast update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply readable ERP contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/index.css')
          s=p.read_text(encoding='utf-8')
          marker='/* ERP-wide stronger text contrast */'
          block='''

/* ERP-wide stronger text contrast */
.erp-shell main {
  color: #1e293b;
}
.erp-shell main p,
.erp-shell main td,
.erp-shell main li,
.erp-shell main label {
  font-weight: 500;
}
.erp-shell main .text-slate-400,
.erp-shell main .text-slate-500 {
  color: #475569 !important;
}
.erp-shell main .text-slate-600 {
  color: #334155 !important;
}
.erp-shell main .text-slate-700 {
  color: #1e293b !important;
}
.erp-shell main input,
.erp-shell main select,
.erp-shell main textarea {
  color: #0f172a;
  font-weight: 500;
}
.erp-shell main input::placeholder,
.erp-shell main textarea::placeholder {
  color: #64748b;
  opacity: 1;
}
.erp-shell main table th {
  color: #334155;
  font-weight: 700;
}
.erp-shell main table td {
  color: #1e293b;
}

@media print {
  .print-page,
  .print-document,
  .print-report,
  [data-print-root] {
    color: #0f172a !important;
    font-weight: 500;
  }
  .print-company-addr,
  .print-company-tax,
  .print-party-addr,
  .print-party-phone,
  .print-party-email,
  .print-meta-label,
  .print-footer,
  .print-footer p {
    color: #334155 !important;
    font-weight: 500 !important;
  }
  .print-th,
  .print-table th {
    color: #0f172a !important;
    font-weight: 700 !important;
  }
  .print-td,
  .print-table td {
    color: #1e293b !important;
    font-weight: 500 !important;
  }
}
'''
          if marker not in s:
              p.write_text(s+block,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          if ! git diff --cached --quiet; then
            git commit -m "Darken ERP-wide text for readability"
            git push origin main
          fi
